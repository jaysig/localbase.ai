<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start - LocalBase.ai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #e0e0e0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #00d9ff;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2em;
            color: #888;
        }

        /* Hero Section - Side by Side Comparison */
        .hero-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 50px;
        }

        .comparison-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .comparison-card.framework {
            border-color: rgba(0, 255, 157, 0.3);
        }

        .comparison-card.unhooked {
            border-color: rgba(255, 157, 0, 0.3);
        }

        .comparison-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d9ff, #00ff9d);
        }

        .comparison-card.framework::before {
            background: linear-gradient(90deg, #00ff9d, #00d9ff);
        }

        .comparison-card.unhooked::before {
            background: linear-gradient(90deg, #ff9d00, #ff5722);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-icon {
            font-size: 2.5em;
            margin-right: 16px;
        }

        .card-title {
            font-size: 1.8em;
            font-weight: bold;
        }

        .framework .card-title {
            background: linear-gradient(135deg, #00ff9d, #00d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .unhooked .card-title {
            background: linear-gradient(135deg, #ff9d00, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-subtitle {
            color: #888;
            font-size: 0.95em;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .size-display {
            display: flex;
            align-items: baseline;
            margin-bottom: 24px;
        }

        .size-number {
            font-size: 4em;
            font-weight: bold;
            color: #00d9ff;
            margin-right: 12px;
        }

        .framework .size-number {
            color: #00ff9d;
        }

        .unhooked .size-number {
            color: #ff9d00;
        }

        .size-unit {
            font-size: 1.5em;
            color: #666;
        }

        .breakdown-list {
            list-style: none;
            padding: 0;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .breakdown-item:last-child {
            border-bottom: none;
        }

        .breakdown-label {
            color: #aaa;
            display: flex;
            align-items: center;
        }

        .breakdown-label::before {
            content: '📁';
            margin-right: 8px;
        }

        .breakdown-value {
            font-weight: bold;
            color: #00d9ff;
        }

        .framework .breakdown-value {
            color: #00ff9d;
        }

        .unhooked .breakdown-value {
            color: #ff9d00;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 217, 255, 0.4);
        }

        .stat-label {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #00d9ff;
        }

        .stat-sub {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }

        /* Chart Containers */
        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .chart-container.full-width {
            grid-column: 1 / -1;
        }

        .chart-title {
            font-size: 1.3em;
            color: #00d9ff;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .section-header {
            font-size: 1.8em;
            color: #00ff9d;
            margin: 50px 0 25px 0;
            font-weight: bold;
            text-align: center;
        }

        /* File Tree Visual */
        .file-tree {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.6;
            color: #aaa;
        }

        .file-tree-item {
            padding: 4px 0;
            padding-left: 20px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            margin-left: 10px;
        }

        .file-tree-item.root {
            border-left: none;
            padding-left: 0;
            margin-left: 0;
            color: #00d9ff;
            font-weight: bold;
        }

        .file-tree-item.dir {
            color: #00ff9d;
        }

        .file-count {
            color: #666;
            font-size: 0.85em;
            margin-left: 8px;
        }

        .important-note {
            background: rgba(255, 157, 0, 0.1);
            border: 1px solid rgba(255, 157, 0, 0.3);
            border-radius: 12px;
            padding: 24px;
            margin-top: 40px;
        }

        .important-note h3 {
            color: #ff9d00;
            margin-bottom: 12px;
        }

        .important-note p {
            color: #ccc;
            line-height: 1.6;
        }

        @media (max-width: 968px) {
            .hero-comparison,
            .chart-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading" id="loading">
            Loading workspace statistics...
        </div>

        <div id="stats-content" style="display: none;">
            <!-- Framework Breakdown -->
            <div class="chart-container full-width">
                <div class="chart-title">Framework Size Breakdown</div>
                <div id="nodeModulesChart"></div>
            </div>
        </div>
    </div>

    <script>
        async function loadWorkspaceStats() {
            try {
                // Get current workspace info
                const workspaceResponse = await fetch('/api/workspace');
                const workspaceData = await workspaceResponse.json();

                if (!workspaceData.success) {
                    throw new Error('Failed to get workspace info');
                }

                // Load detailed workspace stats
                const statsResponse = await fetch('/api/workspace/stats');
                const statsData = await statsResponse.json();

                if (!statsData.success) {
                    throw new Error('Failed to get workspace stats');
                }

                const stats = statsData.stats;

                // Load framework stats
                const frameworkResponse = await fetch('/api/workspace/framework-stats');
                const frameworkData = await frameworkResponse.json();

                if (!frameworkData.success) {
                    throw new Error('Failed to get framework stats');
                }

                const coreStats = frameworkData.coreFramework;
                const instanceStats = frameworkData.instanceFramework;

                // Calculate sizes
                const parseSize = (sizeStr) => {
                    if (!sizeStr) return 0;
                    const num = parseFloat(sizeStr);
                    if (sizeStr.includes('G')) return num * 1024;
                    if (sizeStr.includes('M')) return num;
                    if (sizeStr.includes('K')) return num / 1024;
                    return num;
                };

                const coreSizeMB = parseSize(coreStats.size);
                const instanceSizeMB = parseSize(instanceStats.size);
                const codeSizeMB = parseSize(stats.codeSize);
                const dbSizeMB = parseSize(stats.databaseSize);
                const nodeModulesMB = parseSize(stats.nodeModulesSize);

                // Load and render node_modules breakdown
                loadNodeModulesBreakdown();

                // Show content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('stats-content').style.display = 'block';

            } catch (error) {
                console.error('Error loading workspace stats:', error);
                document.getElementById('loading').textContent = 'Error loading workspace stats: ' + error.message;
            }
        }

        async function loadNodeModulesBreakdown() {
            try {
                const response = await fetch('/api/workspace/node-modules-breakdown');
                const data = await response.json();

                if (!data.success || !data.items || data.items.length === 0) {
                    document.getElementById('nodeModulesChart').innerHTML =
                        '<p style="text-align: center; color: #888; padding: 40px;">No data available</p>';
                    return;
                }

                renderFrameworkTreemap(data.items);
            } catch (error) {
                console.error('Error loading framework breakdown:', error);
                document.getElementById('nodeModulesChart').innerHTML =
                    '<p style="text-align: center; color: #888; padding: 40px;">Error loading data</p>';
            }
        }

        function renderFrameworkTreemap(items) {
            // Color mapping by category
            const categoryColors = {
                'node_modules': '#ff9d00',
                'framework': '#00ff9d'
            };

            // Prepare data for treemap
            const series = [{
                data: items.map(item => ({
                    x: item.name,
                    y: item.sizeMB,
                    fillColor: categoryColors[item.category] || '#666'
                }))
            }];

            const options = {
                series: series,
                chart: {
                    type: 'treemap',
                    height: 500,
                    background: 'transparent',
                    toolbar: {
                        show: false
                    }
                },
                dataLabels: {
                    enabled: true,
                    style: {
                        fontSize: '12px',
                        colors: ['#fff']
                    },
                    formatter: function(text, op) {
                        return [text, op.value.toFixed(1) + ' MB'];
                    }
                },
                plotOptions: {
                    treemap: {
                        distributed: true,
                        enableShades: false
                    }
                },
                legend: {
                    show: true,
                    position: 'bottom',
                    labels: {
                        colors: '#e0e0e0',
                        useSeriesColors: false
                    },
                    markers: {
                        fillColors: Object.values(categoryColors)
                    },
                    customLegendItems: ['node_modules (dependencies)', 'Framework Code']
                },
                tooltip: {
                    theme: 'dark',
                    y: {
                        formatter: function(val) {
                            return val.toFixed(2) + ' MB';
                        }
                    }
                }
            };

            const chart = new ApexCharts(document.querySelector("#nodeModulesChart"), options);
            chart.render();
        }

        // Load stats on page load
        loadWorkspaceStats();
    </script>
</body>
</html>
