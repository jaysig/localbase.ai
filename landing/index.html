<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalBase - Local-first analytics framework</title>
  <meta name="description" content="Local-first analytics framework for marketing teams. Your data stays local.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2'%3E%3Crect x='3' y='11' width='18' height='10' rx='2'/%3E%3Ccircle cx='12' cy='5' r='3'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Background grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(34, 197, 94, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 197, 94, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.2;
      pointer-events: none;
    }

    /* Radial glow */
    .glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      padding: 1rem 1.5rem;
    }

    .header-inner {
      max-width: 56rem;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #71717a;
      font-size: 0.875rem;
    }

    .logo svg { color: #22c55e; }

    .header-links {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .skip-btn {
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      color: #52525b;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .skip-btn:hover { color: #a1a1aa; }

    .github-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 0.75rem;
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .github-link:hover {
      background: #27272a;
      border-color: rgba(34, 197, 94, 0.5);
      color: #fff;
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 1.5rem;
      position: relative;
      z-index: 10;
    }

    .content {
      width: 100%;
      max-width: 40rem;
    }

    /* Intro lines */
    .intro-lines {
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .intro-line {
      color: #52525b;
      transition: color 0.3s;
      line-height: 1.75;
    }

    .intro-line.active { color: #22c55e; }

    .cursor {
      color: #22c55e;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Hero */
    .hero {
      text-align: center;
      margin-bottom: 2rem;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .hero.visible { opacity: 1; }

    .hero-icon {
      position: relative;
      display: inline-block;
      margin-bottom: 1rem;
    }

    .hero-icon svg {
      width: 3rem;
      height: 3rem;
      color: #22c55e;
    }

    .hero-icon::after {
      content: '';
      position: absolute;
      inset: -1rem;
      background: rgba(34, 197, 94, 0.2);
      filter: blur(20px);
      border-radius: 50%;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }

    @media (min-width: 640px) {
      h1 { font-size: 3rem; }
    }

    .tagline {
      color: #71717a;
      font-size: 1rem;
    }

    /* Terminal box */
    .terminal {
      position: relative;
      margin-bottom: 1.5rem;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .terminal.visible { opacity: 1; }

    .terminal-glow {
      position: absolute;
      inset: -4px;
      background: linear-gradient(90deg, rgba(34, 197, 94, 0.2), transparent, rgba(34, 197, 94, 0.2));
      border-radius: 1rem;
      filter: blur(15px);
      opacity: 0.5;
    }

    .terminal-box {
      position: relative;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 0.75rem;
      overflow: hidden;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #27272a;
    }

    .terminal-dot {
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 50%;
    }

    .terminal-dot.red { background: rgba(239, 68, 68, 0.8); }
    .terminal-dot.yellow { background: rgba(234, 179, 8, 0.8); }
    .terminal-dot.green { background: rgba(34, 197, 94, 0.8); }

    .terminal-title {
      margin-left: 0.5rem;
      font-size: 0.75rem;
      color: #52525b;
    }

    .terminal-body {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
    }

    .prompt { color: #22c55e; }

    .command {
      flex: 1;
      color: #fff;
      font-size: 0.875rem;
      word-break: break-all;
    }

    @media (min-width: 640px) {
      .command { font-size: 1rem; }
    }

    .copy-btn {
      padding: 0.5rem;
      background: none;
      border: none;
      border-radius: 0.5rem;
      color: #71717a;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #27272a;
      color: #fff;
    }

    .copy-btn.copied { color: #22c55e; }

    /* Hint */
    .hint {
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .hint.visible { opacity: 1; }

    .hint p {
      color: #52525b;
      font-size: 0.75rem;
      margin-bottom: 1rem;
    }

    .hint-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-size: 0.75rem;
    }

    .hint-links a {
      color: #71717a;
      text-decoration: none;
      transition: color 0.2s;
    }

    .hint-links a:hover { color: #22c55e; }

    .hint-links span { color: #3f3f46; }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      padding: 1.5rem;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-size: 0.75rem;
      color: #52525b;
    }

    .footer-inner span.dot { color: #3f3f46; }

    /* Hide on load, show via JS */
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow"></div>

  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="10" rx="2"/>
          <circle cx="12" cy="5" r="3"/>
          <line x1="12" y1="8" x2="12" y2="11"/>
        </svg>
        <span>localbase</span>
      </div>
      <div class="header-links">
        <button class="skip-btn hidden" id="skipBtn" onclick="skipIntro()">skip intro</button>
        <a href="https://github.com/localbase-ai/localbase.ai" target="_blank" rel="noopener noreferrer" class="github-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="content">
      <!-- Intro lines -->
      <div class="intro-lines" id="introLines">
        <div class="intro-line" id="line0">> LocalBase CLI v1.0</div>
        <div class="intro-line" id="line1">> Local-first analytics framework</div>
        <div class="intro-line" id="line2">> Initializing...</div>
        <span class="cursor" id="introCursor">█</span>
      </div>

      <!-- Hero -->
      <div class="hero" id="hero">
        <div class="hero-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="10" rx="2"/>
            <circle cx="12" cy="5" r="3"/>
            <line x1="12" y1="8" x2="12" y2="11"/>
          </svg>
        </div>
        <h1>LocalBase</h1>
        <p class="tagline">Local-first analytics for marketing teams</p>
      </div>

      <!-- Terminal -->
      <div class="terminal" id="terminal">
        <div class="terminal-glow"></div>
        <div class="terminal-box">
          <div class="terminal-header">
            <div class="terminal-dot red"></div>
            <div class="terminal-dot yellow"></div>
            <div class="terminal-dot green"></div>
            <span class="terminal-title">terminal</span>
          </div>
          <div class="terminal-body">
            <span class="prompt">$</span>
            <code class="command" id="command"></code>
            <button class="copy-btn" id="copyBtn" onclick="copyCommand()" title="Copy to clipboard">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="copyIcon">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="checkIcon" style="display:none">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Hint -->
      <div class="hint" id="hint">
        <p>paste in your terminal to install</p>
        <div class="hint-links">
          <a href="https://github.com/localbase-ai/localbase.ai#readme" target="_blank">Documentation</a>
          <span>•</span>
          <a href="https://github.com/localbase-ai/localbase.ai/issues" target="_blank">Issues</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <span>Open Source</span>
      <span class="dot">•</span>
      <span>MIT License</span>
      <span class="dot">•</span>
      <span>Your data stays local</span>
    </div>
  </footer>

  <script>
    const INSTALL_COMMAND = 'curl -fsSL https://localbase.ai/install | bash';
    let phase = 'intro';
    let introLine = 0;
    let commandIndex = 0;

    // Show skip button after 1s
    setTimeout(() => {
      document.getElementById('skipBtn').classList.remove('hidden');
    }, 1000);

    // Intro animation
    function runIntro() {
      if (phase !== 'intro') return;

      if (introLine < 3) {
        document.getElementById('line' + introLine).classList.add('active');
        introLine++;
        setTimeout(runIntro, 700);
      } else {
        document.getElementById('introCursor').style.display = 'none';
        setTimeout(() => {
          phase = 'typing';
          document.getElementById('introLines').style.display = 'none';
          showMain();
        }, 400);
      }
    }

    function showMain() {
      document.getElementById('hero').classList.add('visible');
      document.getElementById('terminal').classList.add('visible');

      // Type command
      typeCommand();
    }

    function typeCommand() {
      if (commandIndex < INSTALL_COMMAND.length) {
        document.getElementById('command').textContent = INSTALL_COMMAND.slice(0, commandIndex + 1);
        commandIndex++;
        setTimeout(typeCommand, 25);
      } else {
        phase = 'ready';
        document.getElementById('hint').classList.add('visible');
        document.getElementById('skipBtn').classList.add('hidden');
      }
    }

    function skipIntro() {
      phase = 'ready';
      introLine = 3;
      commandIndex = INSTALL_COMMAND.length;

      document.getElementById('introLines').style.display = 'none';
      document.getElementById('hero').classList.add('visible');
      document.getElementById('terminal').classList.add('visible');
      document.getElementById('command').textContent = INSTALL_COMMAND;
      document.getElementById('hint').classList.add('visible');
      document.getElementById('skipBtn').classList.add('hidden');
    }

    function copyCommand() {
      navigator.clipboard.writeText(INSTALL_COMMAND);
      document.getElementById('copyIcon').style.display = 'none';
      document.getElementById('checkIcon').style.display = 'block';
      document.getElementById('copyBtn').classList.add('copied');

      setTimeout(() => {
        document.getElementById('copyIcon').style.display = 'block';
        document.getElementById('checkIcon').style.display = 'none';
        document.getElementById('copyBtn').classList.remove('copied');
      }, 2000);
    }

    // Cmd+K to skip
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        if (phase !== 'ready') skipIntro();
      }
    });

    // Start
    setTimeout(runIntro, 500);
  </script>
</body>
</html>
