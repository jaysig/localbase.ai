<!DOCTYPE html>
<html>
<head>
    <title>💡 LocalBase</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <!-- Load ApexCharts globally for embedded charts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <!-- Load Chart.js globally for embedded charts -->

    <!-- Highcharts removed - using ApexCharts only -->
    <script>
        // Ensure chart libraries are available on window object
        if (typeof ApexCharts !== 'undefined' && !window.ApexCharts) {
            window.ApexCharts = ApexCharts;
        }
        if (typeof Chart !== 'undefined' && !window.Chart) {
            window.Chart = Chart;
        }
    </script>
    <!-- Removed iframe-based preview generator -->
    <style>

<body>
    <div class="header">
        <h1 onclick="goHome()" style="cursor: pointer; margin: 0;">LocalBase</h1>
        <div style="display: flex; align-items: center;">
            <button onclick="openWorkspaceModal()" style="background: #2a2a2a; padding: 6px 12px; border-radius: 4px; font-family: 'Monaco', 'Menlo', monospace; font-size: 12px; color: #667eea; border: 1px solid #333; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <span style="color: #999;">//</span>
                <span id="current-workspace-name">my-workspace</span>
                <span style="color: #555;">•</span>
                <span style="color: #888;">⌘ + K</span>
                <span style="color: #999;">//</span>
            </button>
        </div>
    </div>
    
    <!-- Main Layout Container -->
    <div class="main-layout">
        <!-- Main Content Area -->
        <div class="main-content" style="margin-left: 0; width: 100%;">

            <div class="search-section">
                <input type="text" id="viz-search" placeholder="Search visualizations..." />
            </div>

            <div class="controls">
                <button class="filter-btn" data-filter="all">All</button>
                <button class="filter-btn" data-filter="dashboards">📊 Dashboards</button>
                <button class="filter-btn" data-filter="charts">📈 Charts</button>
                <button class="filter-btn" data-filter="table">📋 Tables</button>
                <button class="filter-btn" data-filter="correlations">🔗 Correlations</button>
                <button class="filter-btn" data-filter="today">⚡ Today</button>
                <button id="new-chart-tab" class="filter-btn" data-filter="new" style="display: none;">✨</button>
            </div>
    
    <!-- Inline Embedded Chart Section -->
    <div id="inline-chart-section" class="inline-chart" style="display: none;">
        <div class="inline-chart-header">
            <h2 id="inline-chart-title">Chart Title</h2>
            <button onclick="closeEmbeddedChart()" style="background: transparent; border: 1px solid #555; color: #999; padding: 8px 12px; border-radius: 0; cursor: pointer; font-size: 14px;">×</button>
        </div>
        <div class="inline-chart-content" id="inline-chart-content">
            <!-- Chart content will be loaded via iframe -->
            <iframe id="inline-chart-iframe" style="width: 100%; height: 100vh; border: none; background: #0a0a0a;"></iframe>
        </div>
    </div>


    <div id="chart-grid" class="chart-grid">
    </div>

    
    
    <script>
        let allVisualizations = [];
        let allMetrics = [];
        let currentFilter = 'all';

        // URL routing functions
        function getVizIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('viz');
        }

        function findVizById(vizId) {
            return allVisualizations.find(viz => viz.id === vizId);
        }

        function updateUrlWithVizId(vizId) {
            const newUrl = vizId ? `${window.location.pathname}?viz=${vizId}` : window.location.pathname;
            window.history.pushState({ vizId }, '', newUrl);
        }

        function generateRandomId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function loadWorkspaceInfo() {
            try {
                const response = await fetch('/api/workspaces');
                const data = await response.json();

                if (data.success && data.workspaces) {
                    const selector = document.getElementById('workspace-selector');
                    selector.innerHTML = '';

                    // Sort workspaces: my-workspace first, then alphabetically
                    const sortedWorkspaces = data.workspaces.sort((a, b) => {
                        if (a.name === 'my-workspace') return -1;
                        if (b.name === 'my-workspace') return 1;
                        return a.name.localeCompare(b.name);
                    });

                    // Populate dropdown with sorted workspaces
                    sortedWorkspaces.forEach(workspace => {
                        const option = document.createElement('option');
                        option.value = workspace.path;
                        option.textContent = workspace.name;
                        option.selected = workspace.active;
                        selector.appendChild(option);
                    });

                    // Add change event listener
                    selector.onchange = async (e) => {
                        const newWorkspacePath = e.target.value;
                        await switchWorkspace(newWorkspacePath);
                    };
                }
            } catch (error) {
                console.error('Error loading workspace info:', error);
                const selector = document.getElementById('workspace-selector');
                selector.innerHTML = '<option value="">Error loading workspaces</option>';
            }
        }

        async function switchWorkspace(workspacePath) {
            try {
                const response = await fetch('/api/workspace/switch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ path: workspacePath })
                });

                const data = await response.json();

                if (data.success) {
                    console.log(`✅ Switched to workspace: ${data.message}`);
                    // Reload visualizations for new workspace
                    loadCharts();
                } else {
                    console.error('Failed to switch workspace:', data.error);
                    alert(`Failed to switch workspace: ${data.error}`);
                }
            } catch (error) {
                console.error('Error switching workspace:', error);
                alert(`Error switching workspace: ${error.message}`);
            }
        }

        async function loadCharts() {

            try {
                // Load visualizations from single source
                try {
                    console.log('🔥 FETCHING VISUALIZATIONS...');
                    const vizResponse = await fetch('/assets/visualizations.json?' + Date.now());
                    console.log('🔥 VISUALIZATIONS RESPONSE:', vizResponse.status);
                    const vizData = await vizResponse.json();
                    console.log('🔥 VISUALIZATIONS DATA:', vizData);
                    allVisualizations = vizData.visualizations || [];
                    console.log('🔥 ALL VISUALIZATIONS:', allVisualizations.length);
                } catch (e) {
                    console.error('🔥 VISUALIZATIONS FETCH ERROR:', e);
                    allVisualizations = [];
                }

                // Don't display charts by default - wait for user to click a tab
                // displayCharts();

                // Check URL for specific visualization first
                const vizId = getVizIdFromUrl();

                // Only update tab if no URL viz is specified
                if (!vizId) {
                    updateNewChartTab();
                }
                if (vizId) {
                    const viz = findVizById(vizId);
                    if (viz) {
                        console.log('🔗 Loading visualization from URL:', vizId);
                        // Switch to "new" tab when loading from URL
                        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                        document.getElementById('new-chart-tab')?.classList.add('active');
                        currentFilter = 'new';
                        showEmbeddedChart(viz.url, viz.title || viz.name, true);
                    } else {
                        console.warn('🔗 Visualization not found for ID:', vizId);

        function formatDate(date) {
            // Handle both Date objects and date strings
            const dateObj = date instanceof Date ? date : new Date(date);
            const today = new Date();
            const isToday = dateObj.toDateString() === today.toDateString();

            if (isToday) return 'Today';

            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            if (dateObj.toDateString() === yesterday.toDateString()) return 'Yesterday';

            return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
        
        function formatTime(date) {
            // Handle both Date objects and date strings
            const dateObj = date instanceof Date ? date : new Date(date);
            return dateObj.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function cycleWorkspace(direction) {
            const selector = document.getElementById('workspace-selector');
            const options = Array.from(selector.options);
            const currentIndex = selector.selectedIndex;

            let newIndex;
            if (direction === 'up') {
                // Previous workspace (wrap around to end if at beginning)
                newIndex = currentIndex > 0 ? currentIndex - 1 : options.length - 1;
            } else {
                // Next workspace (wrap around to beginning if at end)
                newIndex = currentIndex < options.length - 1 ? currentIndex + 1 : 0;
            }

            const newWorkspacePath = options[newIndex].value;
            selector.selectedIndex = newIndex;
            switchWorkspace(newWorkspacePath);

            console.log(`🔥 CYCLED WORKSPACE ${direction.toUpperCase()}: ${options[newIndex].text}`);

        // Workspace Modal State
        let workspaceModalOpen = false;
        let workspaceModalSelectedIndex = 0;
        let workspaceModalItems = [];

        async function openWorkspaceModal() {
            try {
                // Fetch workspaces
                const response = await fetch('/api/workspaces');
                const data = await response.json();

                if (!data.success || !data.workspaces) {
                    console.error('Failed to load workspaces');
                    return;
                }

                // Sort workspaces: my-workspace first, then alphabetically
                workspaceModalItems = data.workspaces.sort((a, b) => {
                    if (a.name === 'my-workspace') return -1;
                    if (b.name === 'my-workspace') return 1;
                    return a.name.localeCompare(b.name);
                });

                // Find active workspace index
                const activeIndex = workspaceModalItems.findIndex(w => w.active);
                workspaceModalSelectedIndex = activeIndex >= 0 ? activeIndex : 0;

                // Update button with current workspace name
                const currentWorkspace = workspaceModalItems[workspaceModalSelectedIndex];
                document.getElementById('current-workspace-name').textContent = currentWorkspace.name;

                // Render workspace list
                renderWorkspaceModal();

                // Show modal
                const overlay = document.getElementById('workspace-modal-overlay');
                overlay.classList.add('active');
                workspaceModalOpen = true;

                // Focus search input to disable Vimium hotkeys
                const searchInput = document.getElementById('workspace-modal-input');
                setTimeout(() => {
                    searchInput.value = '';
                    searchInput.focus();
                }, 0);

                // Add search filtering
                searchInput.oninput = (e) => {
                    const filter = e.target.value.toLowerCase();
                    const items = document.querySelectorAll('.workspace-item');
                    items.forEach((item, index) => {
                        const name = workspaceModalItems[index].name.toLowerCase();
                        if (name.includes(filter)) {
                            item.style.display = '';
                        } else {
                            item.style.display = 'none';
                        }
                    });
                };

                // Add dedicated keydown handler on the input for Tab/Shift+Tab navigation
                searchInput.onkeydown = (e) => {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        if (e.shiftKey) {
                            navigateWorkspaceModal('up');
                        } else {
                            navigateWorkspaceModal('down');
                        }
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        navigateWorkspaceModal('down');
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        navigateWorkspaceModal('up');
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        selectWorkspace();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        closeWorkspaceModal();
                    }
                };

                console.log('🔥 Workspace modal opened');
            } catch (error) {
                console.error('Error opening workspace modal:', error);
            }
        }

        function closeWorkspaceModal() {
            const overlay = document.getElementById('workspace-modal-overlay');
            overlay.classList.remove('active');
            workspaceModalOpen = false;
            console.log('🔥 Workspace modal closed');
        }

        function renderWorkspaceModal() {
            const list = document.getElementById('workspace-modal-list');
            list.innerHTML = '';

            workspaceModalItems.forEach((workspace, index) => {
                const item = document.createElement('div');
                item.className = 'workspace-item';
                if (index === workspaceModalSelectedIndex) {
                    item.classList.add('selected');
                }
                if (workspace.active) {
                    item.classList.add('active-workspace');
                }

                const name = document.createElement('span');
                name.className = 'workspace-name';
                name.textContent = workspace.name;
                item.appendChild(name);

                // Click handler
                item.addEventListener('click', () => {
                    selectWorkspace(index);
                });

                list.appendChild(item);
            });

            // Scroll selected item into view
            const selectedItem = list.querySelector('.workspace-item.selected');
            if (selectedItem) {
                selectedItem.scrollIntoView({ block: 'nearest' });
            }
        }

        function navigateWorkspaceModal(direction) {
            if (direction === 'up' || direction === 'k') {
                workspaceModalSelectedIndex = Math.max(0, workspaceModalSelectedIndex - 1);
            } else if (direction === 'down' || direction === 'j') {
                workspaceModalSelectedIndex = Math.min(workspaceModalItems.length - 1, workspaceModalSelectedIndex + 1);
            }
            renderWorkspaceModal();
        }

        async function selectWorkspace(index = workspaceModalSelectedIndex) {
            if (index < 0 || index >= workspaceModalItems.length) return;

            const workspace = workspaceModalItems[index];
            closeWorkspaceModal();

            // Update button with new workspace name
            document.getElementById('current-workspace-name').textContent = workspace.name;

            // Switch workspace using existing function
            await switchWorkspace(workspace.path);
        }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (event) => {
                // Handle workspace modal navigation
                if (workspaceModalOpen) {
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        closeWorkspaceModal();
                        return;
                    }

                    if (event.key === 'ArrowUp' || event.key === 'k') {
                        event.preventDefault();
                        navigateWorkspaceModal('up');
                        return;
                    }

                    if (event.key === 'ArrowDown' || event.key === 'j') {
                        event.preventDefault();
                        navigateWorkspaceModal('down');
                        return;
                    }

                    if (event.key === 'Enter') {
                        event.preventDefault();
                        selectWorkspace();
                        return;
                    }

                    return; // Block other shortcuts when modal is open
                }

                // Check if user is typing in an input field
                const isTyping = event.target.tagName === 'INPUT' ||
                               event.target.tagName === 'TEXTAREA' ||
                               event.target.contentEditable === 'true';

                if (isTyping) return; // Don't trigger shortcuts while typing

                // Vim navigation for visualization grid (j/k/h/l)
                const cards = Array.from(document.querySelectorAll('.viz-card'));
                const focusedCard = document.querySelector('.viz-card:focus');
                let currentIndex = focusedCard ? cards.indexOf(focusedCard) : -1;

                if (event.key === 'j' || event.key === 'k' || event.key === 'h' || event.key === 'l') {
                    event.preventDefault();

                    if (cards.length === 0) return;

                    // If no card is focused, focus the first one
                    if (currentIndex === -1) {
                        cards[0].focus();
                        return;
                    }

                    // Get grid columns from computed style
                    const gridContainer = document.getElementById('visualizations-grid');
                    const computedStyle = window.getComputedStyle(gridContainer);
                    const columns = computedStyle.gridTemplateColumns.split(' ').length;

                    let newIndex = currentIndex;

                    if (event.key === 'j') { // Down
                        newIndex = Math.min(currentIndex + columns, cards.length - 1);
                    } else if (event.key === 'k') { // Up
                        newIndex = Math.max(currentIndex - columns, 0);
                    } else if (event.key === 'h') { // Left
                        newIndex = Math.max(currentIndex - 1, 0);
                    } else if (event.key === 'l') { // Right
                        newIndex = Math.min(currentIndex + 1, cards.length - 1);
                    }

                    if (newIndex !== currentIndex && cards[newIndex]) {
                        cards[newIndex].focus();
                        cards[newIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    return;
                }

                // Enter: Open focused card
                if (event.key === 'Enter' && focusedCard) {
                    event.preventDefault();
                    focusedCard.click();
                    return;
                }

                // Cmd+K: Open workspace switcher
                const modifierKey = event.metaKey || event.ctrlKey;
                if (modifierKey && event.key === 'k') {
                    event.preventDefault();
                    openWorkspaceModal();
                    return;
                }

                // Escape: Close embedded chart and return to clean state
                if (event.key === 'Escape') {
                    event.preventDefault();
                    const inlineSection = document.getElementById('inline-chart-section');
                    if (inlineSection && inlineSection.style.display !== 'none') {
                        closeEmbeddedChart();
                    }
                    return;
                }

                if (modifierKey) {
                    // Cmd/Ctrl + /: Go home
                    if (event.key === '/') {
                        event.preventDefault();
                        goHome();
                    }

                    // Cmd/Ctrl + Option + Up/Down: Cycle workspaces
                    if (event.altKey && event.key === 'ArrowUp') {
                        event.preventDefault();
                        cycleWorkspace('up');
                    }

                    if (event.altKey && event.key === 'ArrowDown') {
                        event.preventDefault();
                        cycleWorkspace('down');
                    }
                }
            }, { capture: true });

            // Close modal when clicking outside
            document.getElementById('workspace-modal-overlay').addEventListener('click', (event) => {
                if (event.target.id === 'workspace-modal-overlay') {
                    closeWorkspaceModal();
                }
            });

            console.log('🔥 KEYBOARD SHORTCUTS SETUP COMPLETE');
            console.log('   - Cmd+K: Open workspace switcher');
            console.log('   - Escape: Close embedded chart or modal');
            console.log('   - Cmd/Ctrl + /: Return to home');
            console.log('   - Cmd/Ctrl + Option + Up/Down: Cycle workspaces');
        }

                const query = e.target.value.toLowerCase().trim();

                // Clear previous timeout
                clearTimeout(searchTimeout);

                // If less than 2 characters, don't show results
                if (query.length < 2) {
                    // Keep grid empty or show current filter state
                    if (query.length === 0) {
                        // Empty search - return to current filter state
                        displayCharts();
                    }
                    return;
                }

                // Debounce: wait 300ms after user stops typing
                searchTimeout = setTimeout(() => {
                    const filtered = allVisualizations.filter(viz => {
                        return (viz.title || '').toLowerCase().includes(query) ||
                               (viz.name || '').toLowerCase().includes(query) ||
                               (viz.description || '').toLowerCase().includes(query);
                    });
                    displayCharts(filtered);
                }, 300);
            });
        }

        // Initial load first
        loadCharts();

        // Only auto-open if there's no URL viz specified
        if (!getVizIdFromUrl()) {
            checkForAutoOpen();
        }

        // Always set "All" as active - simple default
        setTimeout(() => {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.filter-btn[data-filter="all"]')?.classList.add('active');
        }, 100);
        
        // Set up event listeners after initial load
        setTimeout(() => {
            console.log('🔥 SETTING UP TAB EVENT LISTENERS');
            setupKeyboardShortcuts();
            // Update filter functionality to handle data view
            document.querySelectorAll('.filter-btn').forEach(btn => {
                console.log('🔥 FOUND TAB BUTTON:', btn.textContent, btn.dataset.filter);
                btn.addEventListener('click', (e) => {
                    console.log('🔥 TAB CLICKED:', e.target.dataset.filter);
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentFilter = e.target.dataset.filter;
                    console.log('🔥 CURRENT FILTER SET TO:', currentFilter);
                    
                    if (currentFilter === 'data') {
                        showDataTable();
                    } else if (currentFilter === 'new') {
                        hideDataTable();
                        // Show the newest chart embedded when clicking the new tab
                        if (allVisualizations && allVisualizations.length > 0) {
                            const mostRecentChart = allVisualizations[0];
                            showEmbeddedChart(mostRecentChart.url, mostRecentChart.name || mostRecentChart.title, true);
                        }
                    } else {
                        console.log('🔥 CALLING hideDataTable() and filterCharts()');
                        hideDataTable();
                        filterCharts();
                    }
                    console.log('🔥 TAB CLICK HANDLER COMPLETED');
                });
            });
            console.log('🔥 TAB EVENT LISTENERS SET UP COMPLETE');
        }, 1000);
        
    </script>
        </div> <!-- End main-content -->
    </div> <!-- End main-layout -->

    <!-- Workspace Switcher Modal -->
    <div id="workspace-modal-overlay" class="workspace-modal-overlay">
        <div class="workspace-modal">
            <div class="workspace-modal-header">
                <h3>Switch Workspace</h3>
                <span class="workspace-modal-hint">⌘ + K</span>
            </div>
            <!-- Hidden search input to disable Vimium - must be visible for Vimium to detect it -->
            <input
                type="text"
                id="workspace-modal-input"
                placeholder="Type to filter workspaces..."
                style="width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; margin-bottom: 10px; outline: none;"
            />
            <div id="workspace-modal-list" class="workspace-modal-list"></div>
            <div class="workspace-modal-footer">
                <kbd>↑↓</kbd> to navigate • <kbd>Enter</kbd> to select • <kbd>Esc</kbd> to close
            </div>
        </div>
    </div>

</body>
</html>
