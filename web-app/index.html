<!DOCTYPE html>
<html>
<head>
    <title>💡 LocalBase</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Load ApexCharts globally for embedded charts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <!-- Load Chart.js globally for embedded charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="/assets/chartjs-chart-venn.js"></script>
    <!-- Highcharts removed - using ApexCharts only -->
    <script>
        // Ensure chart libraries are available on window object
        if (typeof ApexCharts !== 'undefined' && !window.ApexCharts) {
            window.ApexCharts = ApexCharts;
        }
        if (typeof Chart !== 'undefined' && !window.Chart) {
            window.Chart = Chart;
        }
    </script>
    <!-- Removed iframe-based preview generator -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #0a0a0a; 
            color: #e5e5e5; 
            font-family: -apple-system, system-ui, sans-serif;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        
        h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 !important;
            padding: 0 !important;
            text-align: left;
            display: block;
        }
        
        .stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
            color: #999;
            margin: 0;
            padding: 0;
        }
        
        .stat strong { color: #fff; }

        .inline-chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            /* margin-bottom: 20px; */
            border-bottom: 1px solid #333;
        }

        .inline-chart-header h2 {
            margin: 0;
            color: #e5e5e5;
        }

        .inline-chart-header button:hover {
            background: #2a2a2a !important;
            color: #fff !important;
            border-color: #667eea !important;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #999;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            background: #2a2a2a;
            color: #fff;
            border-color: #555;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: #fff;
            border-color: #667eea;
        }
        
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .chart-card, .dashboard-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 0;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .chart-card:hover, .dashboard-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .chart-card:focus, .dashboard-card:focus,
        .chart-card:focus-visible, .dashboard-card:focus-visible {
            outline: none !important;
            box-shadow: none !important;
        }

        .chart-card:focus:not(:hover), .dashboard-card:focus:not(:hover) {
            border-color: #2a2a2a;
        }

        
        .dashboard-card {
            border: 1px solid #2a2a2a;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
        }
        
        .dashboard-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 0;
            font-size: 11px;
            font-weight: 600;
            z-index: 10;
        }
        
        .chart-preview {
            height: 200px;
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
        }

        .chart-preview iframe {
            width: 200%;
            height: 200%;
            border: none;
            transform: scale(0.5);
            transform-origin: top left;
            pointer-events: none;
        }

        .preview-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
        }

        .preview-mockup {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .preview-mockup[data-type="dashboard"]::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background:
                linear-gradient(90deg, #667eea 0%, #667eea 45%, transparent 45%, transparent 55%, #764ba2 55%),
                linear-gradient(0deg, #667eea 0%, #667eea 45%, transparent 45%, transparent 55%, #764ba2 55%);
            opacity: 0.3;
            border-radius: 0;
        }

        .preview-mockup[data-type="table"]::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: repeating-linear-gradient(
                0deg,
                #667eea 0px,
                #667eea 3px,
                transparent 3px,
                transparent 18px
            );
            opacity: 0.3;
            border-radius: 0;
        }

        .preview-mockup[data-type="chart"]::before {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 60px;
            background:
                linear-gradient(to top, #667eea 20%, transparent 20%),
                linear-gradient(to top, #764ba2 40%, transparent 40%) 25% 0,
                linear-gradient(to top, #667eea 35%, transparent 35%) 50% 0,
                linear-gradient(to top, #764ba2 60%, transparent 60%) 75% 0;
            background-size: 20% 100%;
            background-repeat: no-repeat;
            opacity: 0.3;
            border-radius: 0;
        }

        .preview-icon {
            font-size: 2.5em;
            z-index: 1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .preview-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .chart-card:hover .preview-placeholder,
        .dashboard-card:hover .preview-placeholder {
            color: #999;
            transform: scale(1.05);
        }
        
        .chart-info {
            padding: 15px;
        }
        
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .chart-meta {
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        
        .chart-type {
            display: inline-block;
            padding: 2px 8px;
            background: #2a2a2a;
            border-radius: 0;
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .no-charts {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        
        
        /* Inline Chart Section */
        .inline-chart {
            background: #1a1a1a;
            margin-bottom: 30px;
            animation: slideDown 0.3s ease-out;
            width: 100% !important;
        }
        
        .inline-chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        #inline-chart-title {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }
        
        
        /* File Browser Styles */
        .file-browser-container {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 0;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .file-browser-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #2a2a2a;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        
        .file-browser-header:hover {
            background: #333;
        }
        
        .file-browser-title {
            color: #e5e5e5;
            font-weight: 600;
            font-size: 16px;
        }
        
        .collapse-arrow {
            color: #999;
            font-size: 14px;
            transition: transform 0.3s ease;
        }
        
        .collapse-arrow.expanded {
            transform: rotate(180deg);
        }
        
        .file-browser-content {
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
        }
        
        .file-browser-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .file-item {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 0;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }
        
        .file-item:hover {
            background: #333;
            border-color: #667eea;
        }
        
        .file-name {
            color: #e5e5e5;
            font-weight: 500;
            margin-bottom: 4px;
            word-break: break-all;
        }
        
        .file-meta {
            color: #999;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }
        
        /* Natural scrolling container for all visualizations */
        .inline-chart-content {
            background: #0a0a0a;
            /* Natural browser scrolling - no height restrictions */
            min-height: 400px;
            overflow: visible;
            padding: 10px;
            width: 100% !important;
            min-width: 100% !important;
        }
        
        #inline-chart-frame {
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
            transform: scale(0.98);
            transform-origin: top left;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Data Table Styles */
        .data-table {
            margin-bottom: 30px;
        }
        
        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px 0;
        }
        
        .data-header h2 {
            margin: 0;
            font-size: 24px;
            color: #e5e5e5;
        }
        
        .data-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .metric-select, .data-search-input {
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 0;
            color: #e5e5e5;
            font-size: 14px;
        }
        
        .metric-select {
            min-width: 200px;
        }
        
        .data-search-input {
            min-width: 250px;
        }
        
        .metric-select:focus, .data-search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .table-container {
            background: #1a1a1a;
        }
        
        #metrics-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        #metrics-table th {
            background: #2a2a2a;
            color: #e5e5e5;
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        #metrics-table td {
            padding: 12px 20px;
            border-bottom: 1px solid #2a2a2a;
            color: #e5e5e5;
        }
        
        #metrics-table tbody tr:hover {
            background: #252525;
        }
        
        .loading-row {
            text-align: center;
            color: #666;
            padding: 40px !important;
        }
        
        .metric-value {
            font-weight: 600;
            color: #667eea;
        }
        
        
        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 0;
            color: #fff;
            font-size: 14px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }
        
        /* New Layout Styles */
        .main-layout {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .left-sidebar {
            width: 300px;
            background: #1a1a1a;
            border-radius: 0;
            border: 1px solid #2a2a2a;
            height: fit-content;
            transition: all 0.3s ease;
        }
        
        .left-sidebar.collapsed {
            width: 60px;
        }
        
        .left-sidebar.collapsed .file-list {
            display: none;
        }
        
        .left-sidebar.collapsed h3 {
            display: none;
        }
        
        .left-sidebar.collapsed .file-count-badge {
            display: none;
        }
        
        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background: #1a1a1a;
            border: 1px solid #333;
            transition: all 0.2s;
        }

        .sidebar-header:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .left-sidebar.collapsed .sidebar-header {
            padding: 8px;
            justify-content: center;
        }
        
        .sidebar-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            color: #e5e5e5;
        }
        
        .file-count-badge {
            background: #667eea;
            color: white;
            padding: 2px 6px;
            border-radius: 0;
            font-size: 11px;
            font-weight: 500;
        }
        
        .file-list {
            padding: 10px;
        }
        
        .file-list .file-item {
            padding: 8px 12px;
            margin-bottom: 4px;
            background: transparent;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        
        .file-list .file-item:hover {
            background: #2a2a2a;
            border-color: #333;
        }
        
        .file-list .file-item:active {
            background: #333;
        }
        
        .file-item-content {
            flex: 1;
            min-width: 0;
            cursor: pointer;
            pointer-events: auto;
        }
        
        .file-item-delete {
            opacity: 0;
            color: #666;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 0;
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        
        .file-item:hover .file-item-delete {
            opacity: 0.4;
        }
        
        .file-item-delete:hover {
            opacity: 0.8;
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
        }
        
        .file-item.delete-mode {
            background: #2a1f1f;
            border-color: #4a2c2c;
        }
        
        .delete-confirm {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
        }
        
        .delete-confirm-text {
            color: #ccc;
            margin-right: 8px;
        }
        
        .delete-btn {
            padding: 2px 8px;
            border-radius: 0;
            border: none;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .delete-btn.yes {
            background: #dc3545;
            color: white;
        }
        
        .delete-btn.yes:hover {
            background: #c82333;
        }
        
        .delete-btn.no {
            background: #495057;
            color: #ccc;
        }
        
        .delete-btn.no:hover {
            background: #6c757d;
        }
        
        .file-item.deleting {
            opacity: 0;
            transform: translateX(-100%);
            margin-bottom: 0;
            max-height: 0;
            padding-top: 0;

        .collapse-arrow {

        }

            font-weight: 500;
            color: #e5e5e5;

        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;

    </style>
</head>
<body>
    <div class="header">
        <div style="margin: 0; padding: 0; text-align: left;">
            <h1 onclick="goHome()" style="cursor: pointer;">LocalBase</h1>
            <div class="stats" style="margin-top: 10px;">
                <div>Total Vizualizations: <strong id="total-count">0</strong></div>
            </div>
        </div>
        <div style="display: flex; align-items: center;">
            <div style="background: #2a2a2a; padding: 8px 16px; border-radius: 4px; font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; color: #667eea; border: 1px solid #333; display: flex; align-items: center; gap: 10px;">
                <span style="color: #999;">//</span>
                <select id="workspace-selector" style="background: transparent; border: none; color: #667eea; font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; cursor: pointer; outline: none; padding: 0;">
                    <option value="">Loading workspaces...</option>
                </select>
                <span style="color: #999;">//</span>
            </div>
        </div>
    </div>
    
    <!-- Main Layout Container -->
    <div class="main-layout">
        <!-- Left Sidebar -->
        <div class="left-sidebar collapsed" id="left-sidebar">
            <div class="sidebar-header" onclick="toggleSidebar()">
                <h3>📁 Viz Files</h3>
                <div class="sidebar-controls">
                    <span class="file-count-badge" id="file-count">0</span>
                    <span class="collapse-arrow" id="sidebar-arrow">◀</span>
                </div>
            </div>
            <div class="file-list" id="file-browser-grid">
                <!-- Files will be populated here -->
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="main-content">

            <div class="controls">
                <button class="filter-btn" data-filter="all">All</button>
                <button class="filter-btn" data-filter="dashboards">📊 Dashboards</button>
                <button class="filter-btn" data-filter="charts">📈 Charts</button>
                <button class="filter-btn" data-filter="table">📋 Tables</button>
                <button class="filter-btn" data-filter="correlations">🔗 Correlations</button>
                <button class="filter-btn" data-filter="today">⚡ Today</button>
                <button id="new-chart-tab" class="filter-btn" data-filter="new" style="display: none;">✨</button>
            </div>
    
    <!-- Inline Embedded Chart Section -->
    <div id="inline-chart-section" class="inline-chart" style="display: none;">
        <div class="inline-chart-header">
            <h2 id="inline-chart-title">Chart Title</h2>
            <button onclick="closeEmbeddedChart()" style="background: transparent; border: 1px solid #555; color: #999; padding: 8px 12px; border-radius: 0; cursor: pointer; font-size: 14px;">×</button>
        </div>
        <div class="inline-chart-content" id="inline-chart-content">
            <!-- Chart content will be loaded via iframe -->
            <iframe id="inline-chart-iframe" style="width: 100%; height: 100vh; border: none; background: #0a0a0a;"></iframe>
        </div>
    </div>


    <div id="chart-grid" class="chart-grid">
        <div class="loading">Loading charts...</div>
    </div>
    
    
    <script>
        let allVisualizations = [];
        let allMetrics = [];
        let currentFilter = 'all';

        // URL routing functions
        function getVizIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('viz');
        }

        function findVizById(vizId) {
            return allVisualizations.find(viz => viz.id === vizId);
        }

        function updateUrlWithVizId(vizId) {
            const newUrl = vizId ? `${window.location.pathname}?viz=${vizId}` : window.location.pathname;
            window.history.pushState({ vizId }, '', newUrl);
        }

        function generateRandomId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function loadWorkspaceInfo() {
            try {
                const response = await fetch('/api/workspaces');
                const data = await response.json();

                if (data.success && data.workspaces) {
                    const selector = document.getElementById('workspace-selector');
                    selector.innerHTML = '';

                    // Populate dropdown with workspaces
                    data.workspaces.forEach(workspace => {
                        const option = document.createElement('option');
                        option.value = workspace.path;
                        option.textContent = workspace.name;
                        option.selected = workspace.active;
                        selector.appendChild(option);
                    });

                    // Add change event listener
                    selector.onchange = async (e) => {
                        const newWorkspacePath = e.target.value;
                        await switchWorkspace(newWorkspacePath);
                    };
                }
            } catch (error) {
                console.error('Error loading workspace info:', error);
                const selector = document.getElementById('workspace-selector');
                selector.innerHTML = '<option value="">Error loading workspaces</option>';
            }
        }

        async function switchWorkspace(workspacePath) {
            try {
                const response = await fetch('/api/workspace/switch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ path: workspacePath })
                });

                const data = await response.json();

                if (data.success) {
                    console.log(`✅ Switched to workspace: ${data.message}`);

        function formatDate(date) {
            // Handle both Date objects and date strings
            const dateObj = date instanceof Date ? date : new Date(date);
            const today = new Date();
            const isToday = dateObj.toDateString() === today.toDateString();

            if (isToday) return 'Today';

            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            if (dateObj.toDateString() === yesterday.toDateString()) return 'Yesterday';

            return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
        
        function formatTime(date) {
            // Handle both Date objects and date strings
            const dateObj = date instanceof Date ? date : new Date(date);
            return dateObj.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

                               event.target.tagName === 'TEXTAREA' ||
                               event.target.contentEditable === 'true';

                if (isTyping) return; // Don't trigger shortcuts while typing

                const modifierKey = event.metaKey || event.ctrlKey;

                if (modifierKey) {
                    // Cmd/Ctrl + B: Toggle left pane
                    if (event.key === 'b' || event.key === 'B') {
                        event.preventDefault();

        // Client-side delete function that calls our delete API
        async function deleteVisualizationById(vizId) {
            try {
                console.log(`🗑️ Deleting visualization: ${vizId}`);

                // Call our delete API
                const response = await fetch(`/api/viz/${vizId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || `Delete request failed: ${response.status}`);
                }

                console.log(`✅ Delete successful:`, result);

                return {
                    success: true,
                    message: result.message
                };

            } catch (error) {
                console.error(`❌ Delete failed:`, error);
                return {
                    success: false,
                    error: error.message
                };
            }
        }

        const metricFilter = document.getElementById('metric-filter');
        const dataSearch = document.getElementById('data-search');
        if (metricFilter) metricFilter.addEventListener('change', displayDataTable);
        if (dataSearch) dataSearch.addEventListener('input', displayDataTable);
        
        // Initial load first
        loadCharts();

        // Only auto-open if there's no URL viz specified
        if (!getVizIdFromUrl()) {
            checkForAutoOpen();
        }

        // Set 'All' as default active pill only if no embedded chart is showing
        setTimeout(() => {
            const embeddedChartSection = document.getElementById('inline-chart-section');
            const isEmbeddedChartVisible = embeddedChartSection && embeddedChartSection.style.display !== 'none';

            // Only reset to 'all' if no embedded chart is currently displayed
            if (!isEmbeddedChartVisible) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelector('.filter-btn[data-filter="all"]')?.classList.add('active');
            }
        }, 100);
        
        // Set up event listeners after initial load
        setTimeout(() => {
            console.log('🔥 SETTING UP TAB EVENT LISTENERS');
            setupKeyboardShortcuts();
            // Update filter functionality to handle data view
            document.querySelectorAll('.filter-btn').forEach(btn => {
                console.log('🔥 FOUND TAB BUTTON:', btn.textContent, btn.dataset.filter);
                btn.addEventListener('click', (e) => {
                    console.log('🔥 TAB CLICKED:', e.target.dataset.filter);
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentFilter = e.target.dataset.filter;
                    console.log('🔥 CURRENT FILTER SET TO:', currentFilter);
                    
                    if (currentFilter === 'data') {
                        showDataTable();
                    } else if (currentFilter === 'new') {
                        hideDataTable();
                        // Show the newest chart embedded when clicking the new tab
                        if (allVisualizations && allVisualizations.length > 0) {
                            const mostRecentChart = allVisualizations[0];
                            showEmbeddedChart(mostRecentChart.url, mostRecentChart.name || mostRecentChart.title, true);
                        }
                    } else {
                        console.log('🔥 CALLING hideDataTable() and filterCharts()');
                        hideDataTable();
                        filterCharts();
                    }
                    console.log('🔥 TAB CLICK HANDLER COMPLETED');
                });
            });
            console.log('🔥 TAB EVENT LISTENERS SET UP COMPLETE');
        }, 1000);
        
        // Global ESC key handler for delete confirmations
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                // Find any active delete confirmation and cancel it
                const deleteMode = document.querySelector('.file-item.delete-mode');
                if (deleteMode) {
                    const noBtn = deleteMode.querySelector('.delete-btn.no');
                    if (noBtn) {
                        noBtn.click();
                    }
                }
            }
        });
    </script>
        </div> <!-- End main-content -->
    </div> <!-- End main-layout -->
</body>
</html>
