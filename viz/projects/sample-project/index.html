<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Project</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation */
    .nav {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .nav-btn {
      padding: 8px 16px;
      background: #334155;
      border: 1px solid #475569;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }
    .nav-btn:hover {
      background: #475569;
      color: #e2e8f0;
    }
    .nav-btn.active {
      background: #4ade80;
      border-color: #4ade80;
      color: #0f172a;
    }

    /* Content area */
    .content {
      flex: 1;
      position: relative;
    }
    .content iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Info panel */
    .info {
      padding: 12px 24px;
      background: #1e293b;
      border-top: 1px solid #334155;
      font-size: 12px;
      color: #64748b;
    }
    .info code {
      background: #334155;
      padding: 2px 6px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <button class="nav-btn active" data-viz="sample-chart-1">Revenue</button>
    <button class="nav-btn" data-viz="sample-chart-2">User Growth</button>
    <button class="nav-btn" data-viz="sample-chart-3">Traffic Sources</button>
  </nav>

  <div class="content">
    <iframe id="viz-frame" src=""></iframe>
  </div>

  <div class="info">
    Project presentation demo. Click tabs to navigate. URL updates via <code>postMessage</code> to parent.
  </div>

  <script>
    const frame = document.getElementById('viz-frame');
    const buttons = document.querySelectorAll('.nav-btn');

    // Build viz URL (same logic as app)
    function buildVizUrl(vizId) {
      const timestamp = Date.now();
      // Check if we're in electron or browser
      if (window.location.protocol === 'localbase:') {
        return `localbase://viz/${vizId}.html?t=${timestamp}`;
      }
      return `http://localhost:3000/viz/${vizId}.html?t=${timestamp}`;
    }

    // Load a viz and notify parent
    function loadViz(vizId) {
      // Update iframe
      frame.src = buildVizUrl(vizId);

      // Update active button
      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.viz === vizId);
      });

      // Notify parent to update URL
      window.parent.postMessage({ type: 'viz:select', vizId: vizId }, '*');
    }

    // Click handlers
    buttons.forEach(btn => {
      btn.addEventListener('click', () => loadViz(btn.dataset.viz));
    });

    // Check for initial viz from URL param
    const params = new URLSearchParams(window.location.search);
    const initialViz = params.get('viz') || 'sample-chart-1';

    // Load initial viz (but don't notify parent - URL is already correct)
    frame.src = buildVizUrl(initialViz);
    buttons.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.viz === initialViz);
    });
  </script>
</body>
</html>
