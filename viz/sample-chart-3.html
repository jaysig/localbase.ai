<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Chart 3</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .chart-container {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 24px;
      max-width: 600px;
    }
    h2 { margin-bottom: 16px; font-size: 18px; color: #4ade80; }
  </style>
</head>
<body>
  <div class="chart-container">
    <h2>Traffic Sources</h2>
    <canvas id="chart"></canvas>
  </div>
  <script>
    const ctx = document.getElementById('chart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Organic', 'Paid', 'Referral', 'Direct'],
        datasets: [{
          data: [45, 25, 18, 12],
          backgroundColor: ['#4ade80', '#22d3ee', '#a78bfa', '#fb923c'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { color: '#94a3b8', padding: 16 }
          }
        }
      }
    });
  </script>
</body>
</html>
